[package]
name = "human-detector"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "human-detector"
path = "src/main.rs"

[dependencies]
tokio = { version = "=1.35.1", features = ["rt-multi-thread", "macros", "time", "process", "fs"] }
reqwest = { version = "=0.11.24", default-features = false, features = ["json", "multipart", "default-tls"] }
serde = { version = "=1.0.195", features = ["derive"] }
serde_json = "=1.0.111"
base64 = "=0.21.7"
anyhow = "=1.0.79"
clap = { version = "=4.4.18", features = ["derive"] }
dotenvy = "=0.15.7"
chrono = { version = "=0.4.31", default-features = false, features = ["clock"] }
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
# Transitive deps pinned to versions compatible with the older rustc/cargo (1.75) available
# in this environment — newer releases require the edition2024 Cargo feature.
indexmap = "=2.2.6"
url = "=2.4.1"
openssl = "=0.10.60"
openssl-sys = "=0.9.96"
